{% load i18n %}
{% if messages %}
    <script>
        setTimeout(() => { reloadMessage(this); $('.oh-modal__close').click(); }, 250);
    </script>
    <span hx-get="{% url 'handbook-list' %}" hx-trigger="load" hx-target="#handbookContainer"></span>
{% endif %}
<div class="oh-modal__dialog">
    <div class="oh-modal__dialog-header pb-0">
        <h2 class="oh-modal__dialog-title">
            {% if instance %}{% trans "Edit Handbook Entry" %}{% else %}{% trans "Add Handbook Entry" %}{% endif %}
        </h2>
        <button class="oh-modal__close" aria-label="{% trans 'Close' %}">
            <ion-icon name="close-outline"></ion-icon>
        </button>
    </div>
    <div class="oh-modal__dialog-body">
        <form
            class="oh-profile-section"
            hx-post="{% url 'handbook-create' %}{% if instance %}?instance_id={{ instance.id }}{% endif %}"
            hx-encoding="multipart/form-data"
            hx-target="#objectCreateModalTarget"
        >
            {{ form.as_p }}
            <div class="d-flex flex-row-reverse">
                <input type="submit" value="{% trans 'Save' %}" class="oh-btn oh-btn--secondary oh-btn--shadow pl-5 pr-5">
            </div>
        </form>
    </div>
</div>
